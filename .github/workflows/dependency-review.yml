name: dependency-review

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write   # only so the summary comment can be posted on a failing review

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Blocks a pull request that would introduce a dependency with a known high-severity
      # advisory. NuGetAudit in Directory.Build.props already fails CI builds on NU1901-NU1904;
      # this catches the same class of problem at review time, with a diff to point at.
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
