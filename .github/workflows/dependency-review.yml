name: dependency-review

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write   # only so the summary comment can be posted on a failing review

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Blocks a pull request that would introduce a dependency with a known high-severity
      # advisory. NuGetAudit in Directory.Build.props already fails CI builds on NU1901-NU1904;
      # this catches the same class of problem at review time, with a diff to point at.
      #
      # continue-on-error: the action hard-fails with "Dependency review is not supported on this
      # repository" until *Dependency graph* is switched on under Settings > Code security. That
      # is a one-click repository setting, not something a workflow can enable, and until it is on
      # this job would redden every pull request without ever having reviewed anything. The step
      # below reports whether the review actually ran, so a skipped check is visible rather than
      # silently green. Remove continue-on-error once Dependency graph is enabled.
      - name: Dependency review
        id: review
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

      - name: Report review status
        run: |
          if [ "${{ steps.review.outcome }}" = "success" ]; then
            echo "Dependency review passed." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Dependency review did not run"
              echo
              echo "The action reported an error - most commonly that **Dependency graph** is not"
              echo "enabled for this repository. Enable it under *Settings > Code security*, then"
              echo "drop \`continue-on-error\` from \`.github/workflows/dependency-review.yml\` so this"
              echo "check becomes enforcing."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
